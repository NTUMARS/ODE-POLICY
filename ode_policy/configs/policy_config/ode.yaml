# ODE policy (ODE-MLP), da/dt = f(c, s, a). Needs the pose zarr from
# ode_policy/libero/build_ode_zarr.py (action = [pose(6), gripper(1)]).
# Defaults (2026-11): proprioception enters through the observation condition, and the gripper
# is a ramped state of the ODE (build the data with build_ode_zarr.py --grip_ramp 5, the
# default). They hold up better across datasets (pauses, discrete gripper signals) and under
# perturbations. The paper's configuration is
#   policy_config.field_use_s=true policy_config.cond_use_s=false policy_config.grip_ode=false
#   policy_config.solver=rk4   (data: build_ode_zarr.py --grip_ramp 1)
_target_: ode_policy.policies.ode.ode_image_policy.ODEImagePolicy

shape_meta: ${shape_meta}

obs_encoder:
  _target_: ode_policy.utils.vision.multi_image_obs_encoder.MultiImageObsEncoder
  shape_meta: ${shape_meta}
  rgb_model:
    _target_: ode_policy.utils.vision.model_getter.get_resnet
    name: resnet18
    weights: null
  resize_shape: null
  crop_shape: null
  random_crop: True
  use_group_norm: True
  share_rgb_model: False
  imagenet_norm: True

horizon: ${horizon}
n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
n_obs_steps: ${n_obs_steps}
obs_as_global_cond: ${obs_as_global_cond}

# FiLM-MLP vector field; width 1732 matches fm_dit / a2a_dit's ~24M parameters outside the
# encoder. 512 is enough for a single LIBERO suite.
hidden_dim: 1732
num_layers: 4
cond_dim: 512
solver: euler        # euler (1 field call per step) | rk2 (midpoint, 2) | rk4 (4, the paper)
substeps: 1
vel_scale: 0.05
# start perturbation: half the samples start ~1 cm / 0.03 rad off the demo and must return
perturb_prob: 0.5
perturb_pos: 0.01
perturb_rot: 0.03
perturb_decay: 0.7
gripper_loss_weight: 0.1
field_arch: mlp       # mlp (ODE-MLP) | dit (ODE-DiT, see ode_dit.yaml)
dit_hidden: 512        # field_arch=dit: token width
dit_layers: 4
dit_heads: 8
dit_tokens: 4          # [a, s] is projected to this many tokens
# proprioception goes into the observation condition (encoded with the images), not straight
# into the vector field: fed to the field directly, the policy can follow its own state (e.g. the
# gripper opening it is commanding) instead of the scene. Paper: field_use_s=true cond_use_s=false
field_use_s: false
cond_use_s: true
# diversity head (12 mixture components); 0 = a purely deterministic policy
side_head: 12
side_hidden: 256
side_mode: velocity     # velocity | position
spread_min: 0.02
mix_min: 0.05
pose_dim: 6            # 6 = end-effector pose (LIBERO); 2 = nav2d agent position
joint_space: false     # true: a is a joint-position vector (real robot)
n_grippers: 1
state_pose_index: null
# gripper as one more ODE state (ramped in the data, see build_ode_zarr.py --grip_ramp) instead
# of a classification head; the command sent stays discrete. Paper: grip_ode=false
grip_ode: true
grip_carry: state       # grip_ode: next chunk continues from the integrated state (sign = snap to the command)
grip_open: -1.0         # grip_ode: the command value meaning open (LIBERO -1); state at an episode start
grip_thresh: null       # grip_ode: closed once the state passes this from the open side; null = 0.8 * grip_open
grip_vel: 1.0           # grip_ode: velocity scale of the gripper state (normalised units per step; a flip is 2)
grip_ode_weight: 1.0    # grip_ode: loss weight of the gripper state
