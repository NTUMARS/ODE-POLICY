_target_: ode_policy.policies.dp.ddim_unet_image_policy.DiffusionUnetImagePolicy

shape_meta: ${shape_meta}

noise_scheduler:
  _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  variance_type: fixed_small # Yilun's paper uses fixed_small_log instead, but easy to cause Nan
  clip_sample: True # required when predict_epsilon=False
  prediction_type: epsilon # or sample

obs_encoder:
  _target_: ode_policy.utils.vision.multi_image_obs_encoder.MultiImageObsEncoder
  shape_meta: ${shape_meta}
  rgb_model:
    _target_: ode_policy.utils.vision.model_getter.get_resnet
    name: resnet18
    weights: null
  resize_shape: null
  crop_shape: null
  # constant center crop
  random_crop: True
  use_group_norm: True
  share_rgb_model: False
  imagenet_norm: True

horizon: ${horizon}
n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
n_obs_steps: ${n_obs_steps}
num_inference_steps: 40
obs_as_global_cond: ${obs_as_global_cond}
# crop_shape: null
diffusion_step_embed_dim: 128
# down_dims: [512, 1024, 2048]
# Parameter-matched to the DiT family so an architecture comparison is controlled:
# [48, 96, 192] puts these policies at 36.00M against the DiT policies' 35.11M
# (+2.5%), where the published Diffusion-Policy width [256, 512, 1024] would put
# them at 192.52M — 5.5x more, and any win would be unattributable. kernel_size
# stays at the upstream 5 so only one knob moved.
# For the published capacity, override on the command line:
#   policy_config.down_dims=[256,512,1024]
down_dims: [48, 96, 192]
kernel_size: 5
n_groups: 8
cond_predict_scale: True
