# Complete H12 FLUX.2-Klein 4B ODE configuration. Paths are supplied by the user.
path_base: null
output_dir: ${paths.output_dir}
batch_size: 15
num_workers: 4
prefetch_factor: 2
persistent_workers: true
lr_scheduler_type: cosine
learning_rate: 0.0001
warmup_steps: null
lr_scheduler_total_steps: null
num_epochs: 10
max_steps: null
log_every: 10
save_every: 0
save_steps: []
save_at_end: true
keep_latest_state_only: false
keep_latest_weights: null
eval_every: 0
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
optimizer_foreach: false
resume: null
wandb:
  enabled: false
  workspace: null
  project: ode-imagewam
  name: null
  group: null
  mode: disabled
data:
  train:
    _target_: ode_imagewam.dataset.ODERobotVideoDataset
    dataset_dirs: ${paths.dataset_dirs}
    shape_meta:
      images:
      - key: image
        raw_shape:
        - 3
        - 512
        - 512
        shape:
        - 3
        - 224
        - 224
      - key: wrist_image
        raw_shape:
        - 3
        - 512
        - 512
        shape:
        - 3
        - 224
        - 224
      action:
      - key: default
        raw_shape: 7
        shape: 7
      state:
      - key: default
        raw_shape: 8
        shape: 8
    num_frames: 13
    global_sample_stride: 1
    past_action_size: 0
    action_video_freq_ratio: 1
    lerobot_video_backend: pyav
    video_size:
    - 224
    - 448
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    video_augmentation:
      _target_: ode_imagewam.data.transforms.VideoAugmentation
      p: 0.65
      augment_types:
      - corrupt_only
      - color_only
      - both
      - both
      color_jitter:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.25
        hue: 0.04
      gamma:
        range:
        - 0.8
        - 1.25
      gaussian_noise:
        std: 0.015
      random_resized_crop:
        scale:
        - 0.92
        - 1.0
        ratio: preserve
      rotate:
        degrees: 8.0
        fill: mean
      exposure:
        ev_range:
        - -0.25
        - 0.25
    require_text_cache: false
    endpoint_frames_only: true
    qwen_text_cache_dir: ${paths.text_cache_dir}
    qwen_context_len: 128
    pretrained_norm_stats: ${paths.normalization_stats}
    processor:
      _target_: ode_imagewam.data.processor.ImageWAMProcessor
      shape_meta:
        images:
        - key: image
          raw_shape:
          - 3
          - 512
          - 512
          shape:
          - 3
          - 224
          - 224
        - key: wrist_image
          raw_shape:
          - 3
          - 512
          - 512
          shape:
          - 3
          - 224
          - 224
        action:
        - key: default
          raw_shape: 7
          shape: 7
        state:
        - key: default
          raw_shape: 8
          shape: 8
      num_obs_steps: 13
      image_obs_steps: 2
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default:
        - true
        - true
        - true
        - true
        - true
        - true
        - false
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: ode_imagewam.data.transforms.ConcatLeftAlign
      train_transforms:
      - _target_: ode_imagewam.data.transforms.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
      val_transforms:
      - _target_: ode_imagewam.data.transforms.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
    text_embedding_cache_dir: null
    context_len: 128
    qwen_text_cache_format: qwen3_flux2
    ode_sidecar_dir: ${paths.sidecar_dir}
  val: null
model:
  _target_: ode_imagewam.model.create_imagewam_ode
  flux2_src_path: ${paths.flux2_src}
  flux2_model_path: ${paths.flux2_model}
  ae_model_path: ${paths.autoencoder}
  variant: klein-base-4b
  qwen3_model_spec: ${paths.qwen_model}
  qwen_context_len: 128
  load_text_encoder: false
  flux2_lora_config:
    enabled: false
  proprio_dim: 8
  mot_checkpoint_mixed_attn: true
  mot_gqa_implementation: repeat
  mot_force_flash_attention: false
  pack_proprio_after_text: true
  flux2_action_image_context:
    mode: prefix_only
  action_dit_pretrained_path: ${paths.action_init}
  zero_init_action_head: false
  action_head_init_scale: 1.0
  action_dit_config:
    action_dim: 7
    hidden_dim: 1024
    num_heads: 24
    attn_head_dim: 128
    num_layers_double: 5
    num_layers_single: 20
    mlp_ratio: 4.0
    max_action_horizon: 64
    use_gradient_checkpointing: true
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_video: 0.5
    lambda_action: 1.0
    action_a2a:
      enabled: false
    image_i2i:
      enabled: false
  ode:
    sidecar_dir: ${paths.sidecar_dir}
    horizon: 12
    cond_dim: 512
    width: 512
    vel_scale: 0.05
    perturb_prob: 0.5
    perturb_decay: 0.7
    grip_weight: 0.1
    layers: 4
    perturb_position_std: 0.01
    perturb_rotation_std: 0.03
device: cuda
num_processes: 1
backend: none
paths:
  dataset_dirs: []
  sidecar_dir: ???
  normalization_stats: ${paths.sidecar_dir}/dataset_stats.json
  text_cache_dir: null
  flux2_src: ???
  flux2_model: ???
  autoencoder: ???
  qwen_model: null
  action_init: null
  output_dir: outputs/imagewam-ode
